[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "romance-reader-intelligence"
version = "0.1.0"
description = "An MCP-Powered Book Discovery, Recommendation and Reader Analytics System for Romance Literature"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Romance Reader Intelligence Engineering Team" }
]
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.10.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pyarrow>=12.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
romance-mcp = "server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
